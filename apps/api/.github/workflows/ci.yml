name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d api_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Real environment variables take precedence over .env.test.
      DATABASE_URL: postgres://app:app@localhost:5432/api_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit --coverage
      - run: bun run test:integration
      - run: bun run test:e2e
