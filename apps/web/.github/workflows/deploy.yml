name: Deploy

# Deploys the dev stack after CI passes on main, or on demand for any stack. Signs in to GCP as
# the deployer service account through Workload Identity Federation: no key file. One-time setup
# by a project admin: `cd infra && bun run provision-deployer --github <owner>/<repo>`, then set
# the two repository variables it prints. Until they exist the job is skipped.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: Pulumi stack to deploy
        default: dev

permissions:
  contents: read
  id-token: write # lets google-github-actions/auth exchange the GitHub OIDC token

concurrency:
  group: deploy-${{ inputs.stack || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: ${{ inputs.stack || 'dev' }}
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: actions/setup-node@v4 # the app build (tsc, vite) and Pulumi run on Node
        with: { node-version-file: .nvmrc }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install Pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
      - name: Deploy
        working-directory: infra
        env:
          STACK: ${{ inputs.stack || 'dev' }}
        run: bun run deploy --stack "$STACK"
